<app-page-header
  description="Products with their size and colour variants. Search also matches SKUs and barcodes."
>
  <a routerLink="/masters/products/new" class="btn btn-primary"
    ><app-icon name="plus-lg" /> Add Product</a
  >
</app-page-header>

<section class="card list-card" aria-label="Products">
  <app-list-toolbar
    placeholder="Search name, code or SKU"
    [search]="list.query().search"
    [status]="list.query().status"
    [hasFilters]="list.hasFilters()"
    (searchChange)="list.setSearch($event)"
    (statusChange)="list.setStatus($event)"
    (clear)="list.clearFilters()"
  >
    <select
      #categorySelect
      class="form-control filter-select"
      aria-label="Filter by category"
      (change)="list.setFilter('categoryId', categorySelect.value)"
    >
      <option value="" [selected]="!list.filterValue('categoryId')">All categories</option>
      @for (category of categories(); track category.id) {
        <option [value]="category.id" [selected]="list.filterValue('categoryId') === category.id">
          {{ category.name }}
        </option>
      }
    </select>
    <select
      #brandSelect
      class="form-control filter-select"
      aria-label="Filter by brand"
      (change)="list.setFilter('brandId', brandSelect.value)"
    >
      <option value="" [selected]="!list.filterValue('brandId')">All brands</option>
      @for (brand of brands(); track brand.id) {
        <option [value]="brand.id" [selected]="list.filterValue('brandId') === brand.id">
          {{ brand.name }}
        </option>
      }
    </select>
  </app-list-toolbar>

  <app-data-table
    entityName="products"
    emptyMessage="Add your first product along with its sizes, colours and prices."
    createLabel="Add Product"
    [rows]="list.items()"
    [columns]="columns"
    [actions]="actions"
    [loading]="list.loading()"
    [error]="list.error()"
    [sort]="list.query().sort"
    [filtered]="list.hasFilters()"
    (action)="onAction($event)"
    (sortChange)="list.setSort($event)"
    (retry)="list.reload()"
    (clearFilters)="list.clearFilters()"
    (create)="create()"
  >
    <ng-template appCell="name" [appCellOf]="list.items()" let-product>
      <a class="cell-link" [routerLink]="['/masters/products', product.id]">{{ product.name }}</a>
      <div class="mono xsmall text-muted">{{ product.code }}</div>
    </ng-template>
    <ng-template appCell="variantCount" [appCellOf]="list.items()" let-product>
      @if (product.variantCount) {
        <span class="badge badge-primary">{{ product.variantCount }}</span>
      } @else {
        <span class="badge badge-muted" title="Sold using the product barcode">None</span>
      }
    </ng-template>
  </app-data-table>

  <app-pagination
    [page]="list.query().page"
    [pageSize]="list.query().pageSize"
    [total]="list.total()"
    (pageChange)="list.setPage($event)"
    (pageSizeChange)="list.setPageSize($event)"
  />
</section>
