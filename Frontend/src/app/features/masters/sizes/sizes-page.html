<app-page-header
  description="Sizes used in product variants — letter sizes, numeric sizes or your own custom sizes."
>
  <button type="button" class="btn btn-primary" (click)="page.openCreate()">
    <app-icon name="plus-lg" /> Add Size
  </button>
</app-page-header>

<section class="card list-card" aria-label="Sizes">
  <app-list-toolbar
    placeholder="Search sizes"
    [search]="list.query().search"
    [status]="list.query().status"
    [hasFilters]="list.hasFilters()"
    (searchChange)="list.setSearch($event)"
    (statusChange)="list.setStatus($event)"
    (clear)="list.clearFilters()"
  >
    <select
      #typeSelect
      class="form-control filter-select"
      aria-label="Filter by size type"
      (change)="list.setFilter('type', typeSelect.value)"
    >
      <option value="" [selected]="!list.filterValue('type')">All size types</option>
      @for (option of typeOptions; track option.value) {
        <option [value]="option.value" [selected]="list.filterValue('type') === option.value">
          {{ option.label }}
        </option>
      }
    </select>
  </app-list-toolbar>

  <app-data-table
    entityName="sizes"
    emptyMessage="Add sizes such as S, M, L, 32 or Free Size to use them in product variants."
    createLabel="Add Size"
    [rows]="list.items()"
    [columns]="columns"
    [actions]="actions"
    [loading]="list.loading()"
    [error]="list.error()"
    [sort]="list.query().sort"
    [filtered]="list.hasFilters()"
    (action)="page.onAction($event)"
    (sortChange)="list.setSort($event)"
    (retry)="list.reload()"
    (clearFilters)="list.clearFilters()"
    (create)="page.openCreate()"
  >
    <ng-template appCell="type" [appCellOf]="list.items()" let-size>
      <span [class]="typeBadge[size.type]">{{ typeLabel(size.type) }}</span>
    </ng-template>
  </app-data-table>

  <app-pagination
    [page]="list.query().page"
    [pageSize]="list.query().pageSize"
    [total]="list.total()"
    (pageChange)="list.setPage($event)"
    (pageSizeChange)="list.setPageSize($event)"
  />
</section>

@if (page.dialog(); as dialog) {
  @if (dialog.mode === 'view') {
    <app-modal title="Size details" [dismissible]="true" (closed)="page.close()">
      <div class="modal-body">
        <app-detail-list [items]="details(dialog.item)" />
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-outline-danger footer-start"
          (click)="page.delete(dialog.item)"
        >
          <app-icon name="trash3" /> Delete
        </button>
        <button type="button" class="btn btn-secondary" (click)="page.close()">Close</button>
        <button type="button" class="btn btn-primary" (click)="page.openEdit(dialog.item)">
          <app-icon name="pencil-square" /> Edit
        </button>
      </div>
    </app-modal>
  } @else {
    <app-modal [title]="dialog.mode === 'edit' ? 'Edit size' : 'Add size'" (closed)="page.close()">
      <app-size-form
        [size]="dialog.mode === 'edit' ? dialog.item : null"
        (saved)="page.onSaved($event)"
      />
    </app-modal>
  }
}
