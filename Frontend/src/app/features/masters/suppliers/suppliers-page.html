<app-page-header description="Vendors and wholesalers you purchase stock from.">
  <button type="button" class="btn btn-primary" (click)="page.openCreate()">
    <app-icon name="plus-lg" /> Add Supplier
  </button>
</app-page-header>

<section class="card list-card" aria-label="Suppliers">
  <app-list-toolbar
    placeholder="Search name, mobile or GST number"
    [search]="list.query().search"
    [status]="list.query().status"
    [hasFilters]="list.hasFilters()"
    (searchChange)="list.setSearch($event)"
    (statusChange)="list.setStatus($event)"
    (clear)="list.clearFilters()"
  />

  <app-data-table
    entityName="suppliers"
    emptyMessage="Add the suppliers you buy from. They will be used in purchase entries later."
    createLabel="Add Supplier"
    [rows]="list.items()"
    [columns]="columns"
    [actions]="actions"
    [loading]="list.loading()"
    [error]="list.error()"
    [sort]="list.query().sort"
    [filtered]="list.hasFilters()"
    (action)="page.onAction($event)"
    (sortChange)="list.setSort($event)"
    (retry)="list.reload()"
    (clearFilters)="list.clearFilters()"
    (create)="page.openCreate()"
  >
    <ng-template appCell="name" [appCellOf]="list.items()" let-supplier>
      <button type="button" class="cell-link" (click)="page.openView(supplier)">
        {{ supplier.name }}
      </button>
      @if (supplier.contactPerson) {
        <div class="xsmall text-muted">{{ supplier.contactPerson }}</div>
      }
    </ng-template>
    <ng-template appCell="gstNumber" [appCellOf]="list.items()" let-supplier>
      @if (supplier.gstNumber) {
        <span class="mono">{{ supplier.gstNumber }}</span>
      } @else {
        <span class="text-muted">Unregistered</span>
      }
    </ng-template>
  </app-data-table>

  <app-pagination
    [page]="list.query().page"
    [pageSize]="list.query().pageSize"
    [total]="list.total()"
    (pageChange)="list.setPage($event)"
    (pageSizeChange)="list.setPageSize($event)"
  />
</section>

@if (page.dialog(); as dialog) {
  @if (dialog.mode === 'view') {
    <app-modal title="Supplier details" size="lg" [dismissible]="true" (closed)="page.close()">
      <div class="modal-body">
        <app-detail-list [items]="details(dialog.item)" />
      </div>
      <div class="modal-footer">
        <button
          type="button"
          class="btn btn-outline-danger footer-start"
          (click)="page.delete(dialog.item)"
        >
          <app-icon name="trash3" /> Delete
        </button>
        <button type="button" class="btn btn-secondary" (click)="page.toggleStatus(dialog.item)">
          {{ dialog.item.status === 'active' ? 'Deactivate' : 'Activate' }}
        </button>
        <button type="button" class="btn btn-primary" (click)="page.openEdit(dialog.item)">
          <app-icon name="pencil-square" /> Edit
        </button>
      </div>
    </app-modal>
  } @else {
    <app-modal
      [title]="dialog.mode === 'edit' ? 'Edit supplier' : 'Add supplier'"
      size="lg"
      (closed)="page.close()"
    >
      <app-supplier-form
        [supplier]="dialog.mode === 'edit' ? dialog.item : null"
        (saved)="page.onSaved($event)"
      />
    </app-modal>
  }
}
